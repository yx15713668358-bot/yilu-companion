name: 页面或功能问题
description: 报告可复现的界面、交互、构建或离线使用问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。v7 尚未公开发布。安全漏洞请不要使用此模板，请阅读 SECURITY.md。

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请填写页面显示的版本、文件名或 commit SHA。
      placeholder: 例如 v7 开发版 / abc1234
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 使用方式
      options:
        - 本地开发服务器
        - 本地离线单 HTML
        - GitHub Pages
        - 其他构建
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与浏览器
      description: 请包含操作系统、浏览器名称和大致窗口宽度。
      placeholder: macOS / Chrome / 390px
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 页面、阵容和阶段
      placeholder: 神谕阿狸 / 对局跟玩 / 4-2

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，逐步写清点击和选择。
      placeholder: |
        1. 打开首页
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图或其他信息
      description: 可拖入截图；请先遮挡账号、聊天记录和其他个人信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 这不是需要私下披露的安全漏洞。
          required: true
        - label: 我没有附带账号、Cookie、访问令牌或其他个人数据。
          required: true


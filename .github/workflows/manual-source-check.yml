name: Manual Riot patch check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-riot-patch-check
  cancel-in-progress: false

jobs:
  manual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official Riot patch page on demand
        id: riot_probe
        run: node scripts/automation/check-riot.mjs --live --output .automation/riot-probe.json

      - name: Run data quality gate
        if: always()
        run: node scripts/automation/quality-gate.mjs --probe .automation/riot-probe.json

      - name: Type-check
        if: success()
        run: npm run check

      - name: Build without publishing
        if: success()
        run: npm run build

      - name: Run project QA
        if: success()
        run: npm run qa

      - name: Preserve health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-health-${{ github.run_id }}
          path: .automation/riot-probe.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      # This workflow runs only after an explicit manual dispatch. It never
      # commits, changes public data, or deploys GitHub Pages.

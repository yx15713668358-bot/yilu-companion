name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise Riot detector without network
        run: node scripts/automation/check-riot.mjs --offline --output .automation/riot-probe.json

      - name: Run data quality gate
        run: node scripts/automation/quality-gate.mjs --probe .automation/riot-probe.json

      - name: Type-check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Build downloadable single HTML
        run: npm run build:single

      - name: Run project QA
        run: npm run qa

      - name: Run single-file QA
        run: npm run qa:single
